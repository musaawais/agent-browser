name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run dist:dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBrowser-macOS-Intel
          path: release/*.dmg
          retention-days: 7
